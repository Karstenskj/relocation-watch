<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Relocation Watch — Christchurch → Auckland</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#1e3a8a; --good:#059669; --goodbg:#ecfdf5; --warn:#b45309; --warnbg:#fffbeb;
  --bad:#64748b; --badbg:#f1f5f9; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1120;--card:#131c31;--ink:#e8edf7;--muted:#94a3b8;--line:#243049;
  --accent:#93b4ff;--good:#34d399;--goodbg:#0c2a20;--warn:#fbbf24;--warnbg:#2a2109;
  --bad:#94a3b8;--badbg:#1a2338;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 20px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 64px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px}
h1{font-size:1.45rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.window{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:16px 0 26px;box-shadow:var(--shadow);font-size:.9rem}
.window b{color:var(--accent)}
.window div+div{margin-top:5px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:32px 0 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.passer{border-left:4px solid var(--good)}
.card.naesten{border-left:4px solid var(--warn)}
.card.nej{border-left:4px solid var(--bad);opacity:.82}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.prov{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.plat{color:var(--muted);font-size:.78rem;margin-top:1px}
.badge{font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge.passer{background:var(--goodbg);color:var(--good)}
.badge.naesten{background:var(--warnbg);color:var(--warn)}
.badge.nej{background:var(--badbg);color:var(--bad)}
.veh{margin:10px 0 0;font-size:.92rem}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0}
.f{font-size:.78rem;background:var(--badbg);border:1px solid var(--line);
  padding:3px 9px;border-radius:7px;color:var(--muted)}
.f b{color:var(--ink);font-weight:600}
.f.ok{background:var(--goodbg);border-color:transparent}.f.ok b,.f.ok{color:var(--good)}
.f.no{background:var(--warnbg);border-color:transparent}.f.no b,.f.no{color:var(--warn)}
.why{margin:12px 0 0;font-size:.88rem;color:var(--muted);border-left:2px solid var(--line);padding-left:11px}
.why b{color:var(--ink);font-weight:600}
.note{margin:9px 0 0;font-size:.82rem;color:var(--muted)}
a.btn{display:inline-block;margin-top:13px;background:var(--accent);color:var(--bg);
  text-decoration:none;font-weight:600;font-size:.85rem;padding:9px 16px;border-radius:9px}
@media (prefers-color-scheme:dark){a.btn{color:#0b1120}}
ul.src{list-style:none;padding:0;margin:0}
ul.src li{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
ul.src a{color:var(--accent);text-decoration:none;font-weight:650;font-size:.95rem}
ul.src .n{font-size:.82rem;color:var(--muted);margin-top:4px}
.pri{font-size:.66rem;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;margin-left:7px;vertical-align:2px}
footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.8rem}
.err{background:var(--warnbg);color:var(--warn);padding:14px;border-radius:11px;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Relocation Watch</h1>
    <p class="sub">Christchurch → Auckland · opdateres automatisk 4× dagligt</p>
  </header>
  <div id="app"><p class="sub">Henter data…</p></div>
</div>

<script>
const FERRY_OK = { "inkluderet":["ok","Færge inkluderet"], "ubekræftet":["","Færge ubekræftet"], "IKKE inkluderet":["no","Færge IKKE inkl."] };
const LBL = { passer:"Passer", naesten:"Tæt på", nej:"Opfylder ikke" };

const dkDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("da-DK",{day:"numeric",month:"short"}) : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dealCard(d){
  const [cls,txt] = FERRY_OK[d.ferry] || ["","Færge: "+d.ferry];
  const facts = [
    `<span class="f"><b>${d.days}</b> dage${d.extraDays?` (+${d.extraDays})`:""}</span>`,
    `<span class="f"><b>${esc(d.price)}</b></span>`,
    `<span class="f ${cls}"><b>${txt}</b></span>`,
    d.fuel && d.fuel!=="ikke nævnt" ? `<span class="f ${d.fuel.startsWith("1 gratis")?"ok":""}">Brændstof: <b>${esc(d.fuel)}</b></span>`:"",
    d.validTo ? `<span class="f">Gælder til <b>${dkDate(d.validTo)}</b></span>`:"",
    d.minAge ? `<span class="f">Min. <b>${d.minAge} år</b></span>`:"",
    d.bond ? `<span class="f">Depositum: <b>${esc(d.bond)}</b></span>`:""
  ].join("");
  return `<article class="card ${d.fit}">
    <div class="chead">
      <div><div class="prov">${esc(d.provider)}</div><div class="plat">${esc(d.platform)}</div></div>
      <span class="badge ${d.fit}">${LBL[d.fit]}</span>
    </div>
    <p class="veh">${esc(d.vehicle)}</p>
    <div class="facts">${facts}</div>
    <p class="why"><b>Vurdering:</b> ${esc(d.fitReason)}</p>
    ${d.ferryDetail?`<p class="note">⛴ ${esc(d.ferryDetail)}</p>`:""}
    ${d.notes?`<p class="note">${esc(d.notes)}</p>`:""}
    <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Åbn tilbud →</a>
  </article>`;
}

function srcItem(s){
  return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>
    <span class="pri">${esc(s.type)}</span>
    <div class="n">${esc(s.note)}</div></li>`;
}

function outItem(o){
  const link = o.email ? `mailto:${o.email}` : o.url;
  return `<li><a href="${esc(link)}" target="_blank" rel="noopener">${esc(o.name)}</a>
    <span class="pri">${o.status==="ikke kontaktet"?"ikke kontaktet":esc(o.status)}</span>
    <div class="n">${esc(o.why)}${o.email?`<br>✉ ${esc(o.email)}`:""}</div></li>`;
}

fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  const order = {passer:0, naesten:1, nej:2};
  const deals = [...d.deals].sort((a,b)=>order[a.fit]-order[b.fit]);
  const w = d.window;
  const srcs = [...d.sources].sort((a,b)=>a.priority-b.priority);
  const outs = [...d.outreach].sort((a,b)=>a.priority-b.priority);
  const hits = deals.filter(x=>x.fit==="passer").length;

  document.getElementById("app").innerHTML = `
    <div class="window">
      <div><b>Afhentning:</b> Christchurch, fra ${dkDate(w.pickupFrom)}</div>
      <div><b>Aflevering:</b> Auckland, mellem ${dkDate(w.dropoffFrom)} og ${dkDate(w.dropoffTo)}</div>
      <div><b>Krav:</b> færge skal være betalt · ${w.pax} person · ${esc(w.preference)}</div>
      <div style="margin-top:9px;color:var(--good);font-weight:650">${hits} tilbud opfylder alle krav lige nu</div>
    </div>

    <h2>Tilbud på ruten (${deals.length})</h2>
    ${deals.map(dealCard).join("")}

    <h2>Platforme at booke fra (${srcs.length})</h2>
    <ul class="src">${srcs.map(srcItem).join("")}</ul>

    <h2>Direkte henvendelser — sportsvogn (${outs.length})</h2>
    <ul class="src">${outs.map(outItem).join("")}</ul>

    <h2>Log</h2>
    <ul class="src">${d.log.slice().reverse().map(l=>
      `<li><div class="n"><b>${new Date(l.ts).toLocaleString("da-DK",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</b><br>${esc(l.summary)}</div></li>`
    ).join("")}</ul>

    <footer>Sidst opdateret ${new Date(d.updated).toLocaleString("da-DK",{weekday:"short",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})} (NZ-tid).
    Næste tjek: 06:50, 11:50, 16:50 eller 21:50.</footer>`;
}).catch(e=>{
  document.getElementById("app").innerHTML =
    `<div class="err">Kunne ikke hente data.json — ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
