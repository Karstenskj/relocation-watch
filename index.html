<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1424">
<title>Relocation Watch, Danmark ved nytår</title>
<style>
:root{
  --bg:#f4f6f9; --bg2:#eaeef4; --card:#fff; --ink:#0d1626; --ink2:#3d4a61; --muted:#6b7a91;
  --line:#e3e8ef; --line2:#d3dae4;
  --accent:#1b4dd8; --accent2:#0f3bb0;
  --good:#0a7d55; --goodbg:#e7f7f0; --goodline:#9fdcc4;
  --warn:#a35a06; --warnbg:#fdf3e3; --warnline:#f0cd93;
  --bad:#7a8699; --badbg:#eff2f6;
  --sh1:0 1px 2px rgba(13,22,38,.05); --sh2:0 2px 4px rgba(13,22,38,.05),0 12px 28px rgba(13,22,38,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1120;--bg2:#0e1728;--card:#131e33;--ink:#e9eef8;--ink2:#c0cbdd;--muted:#8d9cb4;
  --line:#22304a;--line2:#2d3d5c;
  --accent:#7ea4ff;--accent2:#a3bfff;
  --good:#4ade9f;--goodbg:#0b2a20;--goodline:#1c5843;
  --warn:#f8c15c;--warnbg:#2b210c;--warnline:#5c4718;
  --bad:#8d9cb4;--badbg:#182338;
  --sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.32);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:72px}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}
a{color:var(--accent)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.015em;font-size:.98rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.stamp{font-size:.76rem;color:var(--muted);text-align:right;line-height:1.35}

/* hero */
.hero{padding:34px 0 6px}
.route{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.city{font-size:1.9rem;font-weight:760;letter-spacing:-.035em;line-height:1.1}
.arrow{color:var(--accent);font-size:1.5rem;font-weight:700}
.lede{color:var(--ink2);font-size:1.02rem;max-width:60ch;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.chip{font-size:.79rem;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:5px 11px;color:var(--ink2);box-shadow:var(--sh1)}
.chip b{color:var(--ink);font-weight:650}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:var(--sh1)}
.stat .n{font-size:1.75rem;font-weight:760;letter-spacing:-.035em;line-height:1.1}
.stat .l{font-size:.76rem;color:var(--muted);margin-top:2px}
.stat.g .n{color:var(--good)} .stat.w .n{color:var(--warn)}

/* sections */
h2{font-size:1.18rem;letter-spacing:-.025em;margin:44px 0 4px;font-weight:720}
.hint{color:var(--muted);font-size:.87rem;margin:0 0 16px}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:14px;padding:18px;color:var(--muted);font-size:.9rem}

/* deal card */
.deal{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--sh2);margin-bottom:16px}
.deal.passer{border-color:var(--goodline)}
.deal.naesten{border-color:var(--warnline)}
.deal.nej{opacity:.9}
.photo{position:relative;aspect-ratio:16/7;background:var(--bg2);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:100%;height:100%;display:block}
.credit{position:absolute;left:0;bottom:0;right:0;font-size:.68rem;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.68));padding:16px 12px 6px}
.avail{position:absolute;top:11px;left:11px;font-size:.72rem;font-weight:700;padding:5px 10px;
  border-radius:999px;background:var(--good);color:#fff;letter-spacing:.01em;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.avail.snaevert{background:var(--warn)}
.avail.ikke{background:#8592a6}
.sleep{position:absolute;top:11px;right:11px;font-size:.72rem;font-weight:700;padding:5px 10px;
  border-radius:999px;background:rgba(13,22,38,.72);color:#fff;backdrop-filter:blur(6px)}
.body{padding:17px 18px 18px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prov{font-size:1.22rem;font-weight:730;letter-spacing:-.025em;line-height:1.25}
.plat{font-size:.78rem;color:var(--muted);margin-top:2px}
.verdict{font-size:.7rem;font-weight:750;padding:5px 10px;border-radius:999px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.055em}
.verdict.passer{background:var(--goodbg);color:var(--good)}
.verdict.naesten{background:var(--warnbg);color:var(--warn)}
.verdict.nej{background:var(--badbg);color:var(--bad)}
.veh{margin:11px 0 0;font-size:.93rem;color:var(--ink2)}
.rt{margin:3px 0 0;font-size:.85rem;color:var(--muted)}
.zone{margin:6px 0 0;font-size:.88rem;font-weight:650;color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:15px 0 0}
.cell{background:var(--card);padding:10px 12px}
.cell .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cell .v{font-size:.93rem;font-weight:650;margin-top:2px;letter-spacing:-.01em}
.cell.ok .v{color:var(--good)} .cell.no .v{color:var(--warn)}

.plan{margin:14px 0 0;background:var(--bg2);border-radius:11px;padding:11px 13px;font-size:.89rem}
.plan .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan .v{font-weight:680;margin-top:1px}
.why{margin:13px 0 0;font-size:.9rem;color:var(--ink2)}
.meta{margin:9px 0 0;font-size:.82rem;color:var(--muted)}
.btn{display:inline-block;margin-top:15px;background:var(--accent);color:#fff;text-decoration:none;
  font-weight:640;font-size:.88rem;padding:10px 18px;border-radius:10px}
.btn:hover{background:var(--accent2)}

/* manual check */
.manual{background:var(--warnbg);border:1px solid var(--warnline);border-radius:14px;
  padding:15px 17px;margin-bottom:11px}
.manual h3{margin:0;font-size:1.02rem;letter-spacing:-.02em;display:flex;justify-content:space-between;
  gap:10px;align-items:baseline;flex-wrap:wrap}
.manual h3 a{text-decoration:none}
.imp{font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.manual p{margin:8px 0 0;font-size:.87rem;color:var(--ink2)}
.manual p.w{color:var(--muted)}

/* generic list cards */
.list{display:grid;gap:9px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--sh1)}
.item .t{font-weight:660;font-size:.97rem;letter-spacing:-.015em}
.item .t a{text-decoration:none}
.item .d{font-size:.84rem;color:var(--muted);margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:.68rem;font-weight:640;padding:3px 8px;border-radius:6px;background:var(--badbg);color:var(--muted)}
.tag.auto{background:var(--goodbg);color:var(--good)}
.tag.blok{background:var(--warnbg);color:var(--warn)}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:9px}

/* slukket-banner */
.stopped{background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--muted);
  border-radius:14px;padding:16px 18px;margin:22px 0 6px}
.stopped b{display:block;font-size:1.05rem;letter-spacing:-.02em;margin-bottom:4px}
.stopped p{margin:0;color:var(--ink2);font-size:.9rem}

/* foldable section */
details.fold{margin:44px 0 0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;
  padding:0 0 4px;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▸";color:var(--muted);font-size:.9rem;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
.fh2{font-size:1.18rem;letter-spacing:-.025em;font-weight:720}
.cnt{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--badbg);
  border-radius:999px;padding:2px 9px}
details.fold h2{margin-top:0}

footer{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.81rem}
.err{background:var(--warnbg);color:var(--warn);padding:16px;border-radius:12px}
@media(max-width:560px){.city{font-size:1.5rem}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <div class="brand"><span class="dot"></span> Relocation Watch</div>
  <div class="stamp" id="stamp"></div>
</div></div>
<div class="wrap"><div id="app"><p class="hint" style="padding:40px 0">Henter data…</p></div></div>

<script>
const SVGS={
 campervan:'<svg viewBox="0 0 400 175" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="175" fill="#dfe6ef"/><path d="M0 128h400v47H0z" fill="#c8d2df"/><path d="M78 118V58c0-7 5-12 12-12h150c6 0 11 3 14 8l30 46c2 3 5 5 9 6l24 4c7 1 12 7 12 14H78z" fill="#a9bcd4"/><rect x="96" y="60" width="62" height="38" rx="4" fill="#e8eef6"/><rect x="168" y="60" width="52" height="38" rx="4" fill="#e8eef6"/><path d="M236 62h18l24 36h-42z" fill="#e8eef6"/><circle cx="126" cy="122" r="19" fill="#3f4b5e"/><circle cx="126" cy="122" r="8" fill="#c8d2df"/><circle cx="286" cy="122" r="19" fill="#3f4b5e"/><circle cx="286" cy="122" r="8" fill="#c8d2df"/></svg>',
 sedan:'<svg viewBox="0 0 400 175" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="175" fill="#dfe6ef"/><path d="M0 128h400v47H0z" fill="#c8d2df"/><path d="M58 122c-6 0-11-5-11-11v-16c0-8 5-14 13-16l38-9 30-22c5-4 11-6 17-6h68c7 0 13 3 17 8l25 27 44 9c9 2 15 10 15 19v6c0 6-5 11-11 11H58z" fill="#a9bcd4"/><path d="M139 52h56c4 0 8 2 10 5l19 22h-92l3-22c0-3 2-5 4-5z" fill="#e8eef6"/><path d="M118 57l-4 22H86l24-18c2-2 5-3 8-4z" fill="#e8eef6"/><circle cx="118" cy="122" r="21" fill="#3f4b5e"/><circle cx="118" cy="122" r="9" fill="#c8d2df"/><circle cx="288" cy="122" r="21" fill="#3f4b5e"/><circle cx="288" cy="122" r="9" fill="#c8d2df"/></svg>',
 van:'<svg viewBox="0 0 400 175" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="175" fill="#dfe6ef"/><path d="M0 128h400v47H0z" fill="#c8d2df"/><path d="M70 120V54c0-6 5-11 11-11h190c6 0 11 3 14 8l34 44c3 4 8 7 13 7h4c6 0 10 5 10 10v8H70z" fill="#a9bcd4"/><rect x="90" y="56" width="70" height="40" rx="4" fill="#e8eef6"/><path d="M262 56h14l30 40h-44z" fill="#e8eef6"/><circle cx="120" cy="122" r="20" fill="#3f4b5e"/><circle cx="120" cy="122" r="8" fill="#c8d2df"/><circle cx="292" cy="122" r="20" fill="#3f4b5e"/><circle cx="292" cy="122" r="8" fill="#c8d2df"/></svg>'};
SVGS.suv=SVGS.sedan; SVGS.truck=SVGS.van; SVGS.minibus=SVGS.van;
const AVAIL={ledig:["","Ledig"],"ledig-snaevert":["snaevert","Ledig, snævert vindue"],"ikke-i-vindue":["ikke","Ikke i vinduet"],udsolgt:["ikke","Udsolgt"],ukendt:["ikke","Ukendt"]};
const VERD={passer:"Passer",naesten:"Næsten",nej:"Opfylder ikke"};
let ZONE=300;
const DIR={"fra-dk":"Fra Danmark","til-dk":"Til Danmark",zone:"Nær Danmark","indenrigs":"Inden for Danmark"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk=s=>s?new Date(s+"T00:00:00").toLocaleDateString("da-DK",{day:"numeric",month:"short"}):"";
const ts=s=>new Date(s).toLocaleString("da-DK",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const kr=n=>Math.round(n).toLocaleString("da-DK");
let CAP=250;

function card(d){
  let [ac,at]=AVAIL[d.availability?.state]||["ikke","Ukendt"];
  if(d.availability?.confidence&&d.availability.confidence!=="direkte"&&String(d.availability.state).startsWith("ledig")) at="I vinduet, ledighed ikke bekræftet";
  const media=d.imageUrl
    ? `<img src="${esc(d.imageUrl)}" alt="${esc(d.vehicle)}" loading="lazy">`
    : (SVGS[d.vehicleType]||SVGS.sedan);
  const day=d.pricePerDay==null?"Ikke oplyst"
    : d.pricePerDay===0?"Gratis"
    : `${esc(String(d.pricePerDay).replace(".",","))} ${esc(d.currency)}${d.pricePerDayDKK!=null&&d.currency!=="DKK"?` · ca. ${kr(d.pricePerDayDKK)} kr.`:""}`;
  const age=d.minAge!=null?`Mindst ${d.minAge} år`:"Tjek aldersgrænsen";
  const cells=[
    ["Pris pr. dag",day,d.pricePerDayDKK!=null&&d.pricePerDayDKK<=CAP?"ok":"no"],
    ["Dage",d.days??"?",""],
    ["Alderskrav",esc(age)+(d.licenseYears?`, kørekort ${d.licenseYears} år`:""),d.minAge!=null?"":"no"],
    ["Brændstof",d.fuel&&!/^ikke/.test(d.fuel)?esc(d.fuel):"Selv",""],
    d.kmLimit?["Km",esc(d.kmLimit),""]:null,
    d.bond?["Depositum",esc(d.bond),""]:null
  ].filter(Boolean).map(([k,v,c])=>`<div class="cell ${c}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  return `<article class="deal ${d.fit}">
   <div class="photo"><span class="avail ${ac}">${at}</span>${d.direction?`<span class="sleep">${esc(DIR[d.direction]||d.direction)}</span>`:""}${media}</div>
   <div class="body">
     <div class="dhead">
       <div><div class="prov">${esc(d.provider)}</div><div class="plat">${esc(d.platform)}</div></div>
       <span class="verdict ${d.fit}">${VERD[d.fit]}</span>
     </div>
     <p class="veh">${esc(d.vehicle)}${d.canSleepIn?" · kan sove i":""}</p>
     <p class="rt">${esc(d.route)}${d.pickupCountry||d.dropoffCountry?` (${esc(d.pickupCountry||"?")} til ${esc(d.dropoffCountry||"?")})`:""}</p>
     ${d.direction==="zone"&&d.zonePlace?`<p class="zone">${esc(d.zonePlace)}</p>`:""}
     <div class="grid">${cells}</div>
     <div class="plan"><div class="k">Din plan</div><div class="v">${esc(d.yourPlan)}</div></div>
     <p class="why">${esc(d.fitReason)}</p>
     <p class="meta">📅 ${esc(d.availability.detail)}${d.availability.spaces?` · ${esc(d.availability.spaces)}`:""}</p>
     <p class="meta">🧾 ${esc(d.price)}${d.totalCost?`. I alt ${esc(d.totalCost)}`:""}</p>
     ${d.minAgeNote?`<p class="meta">Alder: ${esc(d.minAgeNote)}</p>`:""}
     <p class="meta">Ung fører-tillæg: ${esc(d.youngDriverFee||"ikke bekræftet")}</p>
     ${d.notes?`<p class="meta">${esc(d.notes)}</p>`:""}
     <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Åbn hos ${esc(d.platform)} →</a>
   </div></article>`;
}

fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  const w=d.window; CAP=w.maxPricePerDayDKK; ZONE=w.zoneKm||300;
  const tooOld=x=>x.minAge!=null&&w.maxMinAge!=null&&x.minAge>w.maxMinAge;
  const shown=d.deals.filter(x=>!tooOld(x)), hidden=d.deals.length-shown.length;
  const sortf=(a,b)=>((a.pricePerDayDKK??9e9)-(b.pricePerDayDKK??9e9))||((a.availability.from||"").localeCompare(b.availability.from||""));
  const pick=f=>shown.filter(f).sort(sortf);
  const fra=pick(x=>x.fit==="passer"&&x.direction==="fra-dk");
  const til=pick(x=>x.fit==="passer"&&x.direction==="til-dk");
  const zone=pick(x=>x.fit==="passer"&&x.direction==="zone");
  const naer=pick(x=>x.fit==="naesten"), nej=pick(x=>x.fit==="nej");
  document.getElementById("stamp").innerHTML=
    `Opdateret ${ts(d.updated)}<br>${d.stopped?"Slukket, opdateres ikke mere":"Tjekkes hver 3. time"}`;
  if(d.stopped){const dot=document.querySelector(".dot"); if(dot){dot.style.background="var(--muted)";dot.style.boxShadow="none";}}

  const sec=(title,hint,list,emptyText)=>`<h2>${title}</h2><p class="hint">${hint}</p>${list.length?list.map(card).join(""):`<div class="empty">${emptyText}</div>`}`;
  const foldSec=(title,hint,list,emptyText)=>list.length
    ? `<details class="fold"><summary><span class="fh2">${title}</span><span class="cnt">${list.length}</span></summary><p class="hint">${hint}</p>${list.map(card).join("")}</details>`
    : `<h2>${title}</h2><p class="hint">${hint}</p><div class="empty">${emptyText}</div>`;
  const autoSrc=d.sources.filter(s=>s.autoKey).length;
  const srcTag=s=>s.autoKey?["auto","læses automatisk"]
    :s.access==="blokeret"?["blok","blokerer robotter"]
    :s.access==="js"?["blok","kun app eller JavaScript"]
    :s.access==="login"?["blok","kræver login"]
    :["","tjek selv"];
  const emptyNY="Ingen lige nu. Udbyderne lægger flyttebiler op med kort varsel. Imoova 2 til 14 dage før afhentning og de svenske ordninger 0 til 7 dage før, så nytårsbiler ventes tidligst omkring 12. dec. Ture med en ende i Danmark er sjældne."+(d.stopped?"":" Siden tjekker hver tredje time.");
  const fx=w.fxSource||{};

  document.getElementById("app").innerHTML=`
   ${d.stopped?`<div class="stopped"><b>Overvågningen er slut</b><p>Overvågningen sluttede efter ${dk(w.stopAfter)}. Det automatiske tjek er slukket, og siden opdateres ikke længere.</p></div>`:""}
   <div class="hero">
     <div class="route"><span class="city">${esc(w.home)}</span><span class="arrow">⇄</span><span class="city">Europa</span></div>
     <p class="lede">Gratis eller næsten gratis flyttebiler omkring nytår, der starter eller slutter i Danmark eller inden for ${ZONE} km af Danmark. Begge retninger tæller.${d.stopped?"":" Overvåges automatisk hver tredje time."}</p>
     <p class="hint">Afstanden er målt i luftlinje til det nærmeste punkt i Danmark. Bornholm tæller ikke som udgangspunkt, så fx Hamborg ligger ca. 140 km fra Danmark og Berlin ca. 245 km.</p>
     <div class="chips">
       <span class="chip">Afhentning <b>${dk(w.pickupFrom)} 2026 til ${dk(w.pickupTo)} 2027</b></span>
       <span class="chip">Den ene ende i <b>${esc(w.home)}</b> eller højst <b>${ZONE} km</b> derfra</span>
       <span class="chip">Maks <b>${w.maxPricePerDayDKK} kr./dag</b> for bilen</span>
       <span class="chip"><b>${w.pax} personer</b> med bagage</span>
       <span class="chip">Dansk kørekort</span>
     </div>
     <div class="stats">
       <div class="stat g"><div class="n">${fra.length+til.length+zone.length}</div><div class="l">opfylder alle krav</div></div>
       <div class="stat w"><div class="n">${naer.length}</div><div class="l">næsten</div></div>
       <div class="stat"><div class="n">${d.sources.length}</div><div class="l">kilder gennemgået</div></div>
     </div>
     ${hidden?`<p class="hint">${hidden} tilbud med for høj aldersgrænse er sorteret fra.</p>`:`<p class="hint">Tilbud med for høj aldersgrænse bliver sorteret fra.</p>`}
   </div>

   ${sec("Fra Danmark","Afhentning i Danmark i vinduet, aflevering i et andet land, prisen under loftet.",fra,emptyNY)}
   ${sec("Til Danmark","Afhentning i et andet land i vinduet, aflevering i Danmark, prisen under loftet.",til,"Ingen lige nu. Se forklaringen ovenfor.")}
   ${sec(`Inden for ${ZONE} km af Danmark`,`Ingen ende i Danmark, men den ene ende ligger højst ${ZONE} km fra Danmark, fx i Hamborg, Berlin, Malmö eller Oslo. Den anden ende kan ligge hvor som helst i Europa. Kortet viser stedet og afstanden. Regn rejsen derhen eller hjem med.`,zone,"Ingen lige nu.")}
   ${sec("Næsten",`Næsten alt passer. Enten går turen inden for Danmark, eller datoen ligger op til ${w.nearMissDays} dage ved siden af.`,naer,"Ingen lige nu.")}
   ${foldSec("Opfylder ikke kravene",`Ture med en ende i Danmark eller inden for ${ZONE} km, som ikke passer. Med her, så du kan se mønstret. Klik for at folde ud.`,nej,"Ingen lige nu.")}

   <h2>Det kan du vente ved nytår</h2>
   <p class="hint">Hvad undersøgelserne viser. Kun det, der kan dokumenteres.</p>
   <div class="list">${(d.patterns||[]).map(p=>`<div class="item">
     <div class="t">${esc(p.title)}</div>
     <div class="d">${esc(p.text)}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">Kilde</a>, tjekket ${dk(p.checked)}</div></div>`).join("")}</div>

   <h2>Tjekliste</h2>
   <p class="hint">Rækkefølgen for at overvåge og booke.</p>
   <div class="list">${(d.checklist||[]).map((c,i)=>`<div class="item">
     <div class="t">${i+1}. ${esc(c.step)}</div><div class="d">${esc(c.text)}</div></div>`).join("")}</div>

   <h2>Regler og skjulte omkostninger</h2>
   <p class="hint">Det, der kan komme oveni prisen for bilen. Hver linje har sin kilde og datoen for tjekket.</p>
   <div class="list">${(d.rules||[]).map(r=>`<div class="item">
     <div class="t">${esc(r.topic)}</div>
     <div class="d">${esc(r.text)}<br><a href="${esc(r.url)}" target="_blank" rel="noopener">Kilde</a>, tjekket ${dk(r.checked)}</div></div>`).join("")}</div>

   <h2>Disse skal du selv tjekke</h2>
   <p class="hint">Robotten kan ikke læse dem. Her står hvorfor, og hvad du kan gøre i stedet.</p>
   ${d.manualCheck.map(m=>`<div class="manual">
     <h3><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)} →</a><span class="imp">${esc(m.impact)} betydning</span></h3>
     <p><b>Hvorfor:</b> ${esc(m.reason)}</p>
     <p class="w"><b>I stedet:</b> ${esc(m.workaround)}</p></div>`).join("")}

   <h2>Slå disse alarmer til</h2>
   <p class="hint">Engangsopsætning, der får tilbuddene til at komme til dig af sig selv.</p>
   <div class="list">${d.alerts.map(a=>`<div class="item">
     <div class="t"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)} →</a></div>
     <div class="d">${esc(a.how)}<br><b>Hvorfor:</b> ${esc(a.why)}</div>
     <div class="tags"><span class="tag">${a.minutes} min</span></div></div>`).join("")}</div>

   <h2>Skriv direkte til udlejerne</h2>
   <p class="hint">Flyttebiler til og fra Danmark kommer sjældent på listerne. Brug kontaktformularen på deres hjemmeside. Mailskabeloner står i EMAILS.md i repoet.</p>
   <div class="list">${[...d.outreach].sort((a,b)=>a.priority-b.priority).map(o=>`<div class="item">
     <div class="t"><a href="${esc(o.email?"mailto:"+o.email:o.url)}" target="_blank" rel="noopener">${esc(o.name)} →</a></div>
     <div class="d">${esc(o.why)}${o.email?`<br>✉ ${esc(o.email)}`:""}${o.phone?`<br>☎ ${esc(o.phone)}`:""}</div>
     <div class="tags"><span class="tag">${esc(o.status)}</span></div></div>`).join("")}</div>

   <h2>Alle kilder</h2>
   <p class="hint">${autoSrc} kilder læses af robotten hver tredje time. De ${d.sources.length-autoSrc} andre er gennemgået i hånden, og her står hvorfor de ikke kan automatiseres.</p>
   <div class="srcgrid">${[...d.sources].sort((a,b)=>((b.autoKey?1:0)-(a.autoKey?1:0))||(a.priority-b.priority)).map(s=>`<div class="item">
     <div class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} →</a></div>
     <div class="d">${esc(s.note)}<br><b>Danmark:</b> ${esc(s.denmark||"ikke bekræftet")}<br><b>Alder:</b> ${esc(s.minAge||"ikke bekræftet")}<br><b>Ung fører-tillæg:</b> ${esc(s.youngDriverFee||"ikke bekræftet")}${s.lastCheck?`<br><span style="opacity:.8">Sidst læst ${ts(s.lastCheck.ts)}${s.lastCheck.ok?` · ${s.lastCheck.count} med Danmark eller zonen${s.lastCheck.hidden?` (${s.lastCheck.hidden} flere ikke vist)`:""}${s.lastCheck.others!=null?`, ${s.lastCheck.others} andre`:""}${s.lastCheck.partial?` · ${esc(s.lastCheck.partial)}`:""}`:" · FEJLEDE"}</span>`:""}</div>
     <div class="tags"><span class="tag">${esc(s.type)}</span>
     <span class="tag ${srcTag(s)[0]}">${srcTag(s)[1]}</span></div></div>`).join("")}</div>

   ${d.watch&&d.watch.length?`<h2>Sider robotten holder øje med</h2>
   <p class="hint">Sider uden en liste, robotten kan aflæse. Robotten gemmer et aftryk af teksten og siger til i loggen, hvis den ændrer sig, eller hvis en dansk by dukker op.</p>
   <div class="srcgrid">${d.watch.map(x=>`<div class="item">
     <div class="t"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)} →</a></div>
     <div class="d">${esc(x.detail||"")}</div>
     <div class="tags"><span class="tag ${x.status==="nævner Danmark"?"auto":x.status==="ændret"?"blok":""}">${esc(x.status)}</span></div></div>`).join("")}</div>`:""}

   <h2>Log</h2>
   <p class="hint">Hvad der er sket ved hvert tjek.</p>
   <div class="list">${[...d.log].reverse().map(l=>`<div class="item">
     <div class="t">${new Date(l.ts).toLocaleString("da-DK",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</div>
     <div class="d">${esc(l.summary)}</div></div>`).join("")}</div>

   <footer>${d.stopped?"Overvågningen er slut, og siden opdateres ikke længere.":`Tjekkes automatisk hver tredje time døgnet rundt. Slukker af sig selv efter ${dk(w.stopAfter)}, den sidste afhentningsdag, der tæller som næsten.`}<br>
   Afstande er regnet ud fra stednavne i <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> (CC BY 4.0) og Danmarks omrids fra <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (public domain).<br>
   Priser i kroner er cirka. Kurserne er ${esc(fx.name||"")} fra ${dk(fx.rateDate)}, <a href="${esc(fx.url)}" target="_blank" rel="noopener">kilde</a>.<br>
   Alle datoer og priser skal bekræftes hos udlejeren, før du booker.</footer>`;
}).catch(e=>{document.getElementById("app").innerHTML=`<div class="err">Kunne ikke hente data.json. ${esc(e.message)}</div>`});
</script>
</body>
</html>
